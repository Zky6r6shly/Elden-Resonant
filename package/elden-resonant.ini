; Elden Resonant settings. Everything here is optional.
;
; Where CONTROL Resonant is installed, if the mod can't find it by itself
; (it looks in your Steam libraries and the Epic Games launcher).
; cr_path=D:\Games\CONTROL Resonant
;
; Volume of CONTROL Resonant's sounds, 0.0 to 1.0.
volume=0.8
;
; Pin a sound to an exact file inside CONTROL Resonant's archives.
; The log (%LOCALAPPDATA%\EldenResonant\elden-resonant.log) lists the files it picked.
; cue.arrival=audio/music/some_track.wem
